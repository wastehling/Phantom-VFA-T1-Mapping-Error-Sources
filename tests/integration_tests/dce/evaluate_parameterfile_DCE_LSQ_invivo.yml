experiment:
  name: 'evaluate_invivo_DCE_LSQ'
  target_folder: 'ncde/TestResults/'

data:
  in_vivo:
    train: []
    validation: []
    test:
      - name: 'studyA'
        path: '/path/to/your/data/'
        dataloader: 'qmri.data_loading.dce.load_dce_data.load_dce_subject'
        patient_ids: [ 1 ]
        qmri: 'DCE'
        load_mask: false
        load_slices: [8,10]
        slice_axis: 3
        temporal_resolution: 0.08 #in minutes
        load_t1_map: true
        flip_t1_map: true
        flip_t1_map_axis: 2
        add_aif_image: true
        aif:
         Hct: 0.40
         aif:
           ab: 7.9785
           ae: 0.5216
           ar: 0.0482
           mb: 32.8855
           me: 0.1811
           mm: 9.1868
           mr: 15.8167
           t0: 0
           tr: 0.2533
  simulation:
    train: []
    validation: []
    test: []

preprocessing:
  utils.data_processing.processors.SignalToConc.SignalToConc:
    processing_parameters:
      TR: 0.0038
      flip_angle: 25
      relaxivity: 4.1
      S0_timepoints: 4

qmri_fit:
  model: 'DCE'
  mapping_method: 'sigmoid'
  parameter_ranges:
    ke: [0.1, 2]
    ve: [0.01, 0.7]
    vp: [0.001, 0.05]
    r1: [0.5, 0.333]
    dt: [0.01, 1]
  aif:
    Hct: 0.40
    aif:
      ab: 7.9785
      ae: 0.5216
      ar: 0.0482
      mb: 32.8855
      me: 0.1811
      mm: 9.1868
      mr: 15.8167
      t0: 0
      tr: 0.2533

visualization:
  qmri.visualization.visualization_functions.store_images_as_nii: { }

metrics:
  utils.metrics.evaluation_metrics.normalized_RMSE:
    qmri_model: 'DCE'
    range:
      signals: 1
      ke: 1.9
      ve: 0.69
      vp: 0.049
      dt: 0.99

model:
  family: 'LSQ'
  prediction_function: 'models.classical_fitting.LSQ.prediction.prediction'

test:
  batch_size: 32
